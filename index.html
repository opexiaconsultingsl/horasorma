<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMPOAMOR - Reloj</title>

<style>
:root {
    --campoamor-brown: #49382C;
    --campoamor-brown-dark: #2C211A;
    --campoamor-cream: #F7F2EC;
    --campoamor-sand: #D8C3A9;
    --campoamor-white: #FFFFFF;
    --campoamor-shadow: rgba(44, 33, 26, 0.32);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 12% 18%, rgba(216,195,169,0.35), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(255,255,255,0.14), transparent 28%),
        linear-gradient(135deg, var(--campoamor-brown-dark), var(--campoamor-brown));
    color: var(--campoamor-white);
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,0.045) 0px,
            rgba(255,255,255,0.045) 8px,
            transparent 8px,
            transparent 34px
        );
    opacity: 0.55;
    pointer-events: none;
}

.app {
    position: relative;
    min-height: 100vh;
    padding: clamp(22px, 4vw, 54px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
}

.logo-card {
    width: min(900px, 92vw);
    margin: 0 auto;
    background: rgba(255,255,255,0.94);
    border-radius: 36px;
    padding: clamp(18px, 3vw, 34px) clamp(28px, 5vw, 70px);
    box-shadow: 0 28px 70px var(--campoamor-shadow);
    border: 1px solid rgba(255,255,255,0.5);
}

.logo-card img {
    width: 100%;
    max-height: 145px;
    object-fit: contain;
    display: block;
}

.logo-fallback {
    display: none;
    color: var(--campoamor-brown);
    font-size: clamp(42px, 9vw, 118px);
    font-weight: 900;
    letter-spacing: 4px;
}

.machine-banner {
    width: min(760px, 92vw);
    margin: 34px auto 0;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.24);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 18px 34px;
    font-size: clamp(30px, 5vw, 64px);
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--campoamor-white);
    box-shadow: 0 18px 42px rgba(0,0,0,0.24);
}

.hero {
    margin: clamp(28px, 6vh, 70px) auto;
    width: min(1180px, 96vw);
    background: rgba(247,242,236,0.95);
    color: var(--campoamor-brown-dark);
    border-radius: 48px;
    padding: clamp(34px, 5vw, 70px);
    box-shadow: 0 34px 90px rgba(0,0,0,0.38);
    border: 1px solid rgba(255,255,255,0.62);
}

.label {
    margin: 0 0 12px;
    font-size: clamp(16px, 2vw, 28px);
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--campoamor-brown);
    opacity: 0.75;
}

.clock {
    font-size: clamp(96px, 19vw, 255px);
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: -6px;
    color: var(--campoamor-brown);
    text-shadow: 0 10px 0 rgba(216,195,169,0.55);
}

.date {
    margin-top: 24px;
    font-size: clamp(24px, 4vw, 54px);
    font-weight: 900;
    color: var(--campoamor-brown-dark);
}

.footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 800;
    opacity: 0.9;
}

.pill {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 12px 22px;
    backdrop-filter: blur(8px);
}

button {
    border: 2px solid rgba(255,255,255,0.52);
    background: rgba(255,255,255,0.92);
    color: var(--campoamor-brown);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: clamp(15px, 1.6vw, 20px);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 16px 34px rgba(0,0,0,0.30);
}

@media (max-width: 700px) {
    .app {
        padding: 18px;
    }

    .logo-card {
        border-radius: 24px;
    }

    .hero {
        border-radius: 30px;
    }

    .clock {
        letter-spacing: -3px;
    }
}

.hour-mark {
    animation: hourPulse 5s ease-in-out;
}

.hour-mark .clock {
    animation: clockZoom 5s ease-in-out;
}

.hour-mark .machine-banner {
    animation: bannerSlide 5s ease-in-out;
}

.hour-message {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(255,255,255,0.96);
    color: var(--campoamor-brown);
    border-radius: 34px;
    padding: 28px 48px;
    font-size: clamp(34px, 6vw, 86px);
    font-weight: 900;
    letter-spacing: 3px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.42);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
}

.hour-message.show {
    animation: messagePop 5s ease-in-out;
}

@keyframes hourPulse {
    0% { filter: brightness(1); }
    20% { filter: brightness(1.25); }
    100% { filter: brightness(1); }
}

@keyframes clockZoom {
    0% { transform: scale(1); }
    18% { transform: scale(1.08); }
    34% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
}

@keyframes bannerSlide {
    0% { transform: translateY(0); }
    20% { transform: translateY(-12px); }
    40% { transform: translateY(0); }
    60% { transform: translateY(-6px); }
    100% { transform: translateY(0); }
}

@keyframes messagePop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
    14% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
    24% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
}
</style>
</head>

<body>

<div id="hourMessage" class="hour-message">CAMBIO DE HORA</div>

<div class="app" id="app">

    <header class="logo-card">
        <img src="logo-campoamor.png" alt="Logo Campoamor" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
        <div id="logoFallback" class="logo-fallback">CAMPOAMOR</div>
    </header>

    <div class="machine-banner">
        MÁQUINA SORMA
    </div>

    <main class="hero">
        <p class="label">Hora actual</p>
        <div class="clock" id="clock">--:--:--</div>
        <div class="date" id="date">--</div>
    </main>

    <footer class="footer">
        <div class="pill">CAMPOAMOR</div>
        <button onclick="toggleFullscreen()">⛶ Pantalla completa</button>
    </footer>

</div>

<script>
let lastHourAnimation = null;

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent = now.toLocaleTimeString("es-ES", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    document.getElementById("date").textContent = now.toLocaleDateString("es-ES", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

    if (now.getMinutes() === 0 && now.getSeconds() === 0) {
        const hourKey = now.toDateString() + "-" + now.getHours();

        if (lastHourAnimation !== hourKey) {
            lastHourAnimation = hourKey;
            triggerHourAnimation();
        }
    }
}

function triggerHourAnimation() {
    const app = document.getElementById("app");
    const message = document.getElementById("hourMessage");

    app.classList.remove("hour-mark");
    message.classList.remove("show");

    void app.offsetWidth;

    app.classList.add("hour-mark");
    message.classList.add("show");

    setTimeout(() => {
        app.classList.remove("hour-mark");
        message.classList.remove("show");
    }, 5200);
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

document.addEventListener("keydown", function(e) {
    if (e.key.toLowerCase() === "f") toggleFullscreen();
});

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
